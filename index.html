<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Holographic Display System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <!-- HOLOGRAM CENTER -->
        <div class="hologram-display" id="hologramContainer">
            <div class="hologram-overlay">
                <div class="corner-marker top-left"></div>
                <div class="corner-marker top-right"></div>
                <div class="corner-marker bottom-left"></div>
                <div class="corner-marker bottom-right"></div>
                
                <div class="hologram-title" id="suitIndicator">SPIDER-MAN</div>
                <div class="hologram-status">
                    <span id="signal">● ● ● ● ●</span>
                </div>
            </div>
        </div>

        <!-- CONTROL PANEL -->
        <div class="control-panel">
            <!-- SUIT SELECTION -->
            <div class="panel-section">
                <div class="section-title">SUIT DESIGNS</div>
                <div class="button-grid">
                    <button class="ctrl-btn active" data-suit="stark">STARK</button>
                    <button class="ctrl-btn" data-suit="homemade">HOMEMADE</button>
                    <button class="ctrl-btn" data-suit="stealth">STEALTH</button>
                    <button class="ctrl-btn" data-suit="ironspider">IRON SPIDER</button>
                </div>
            </div>

            <!-- WEB SHOOTER SELECTION -->
            <div class="panel-section">
                <div class="section-title">WEB SHOOTER CONFIG</div>
                <div class="button-grid">
                    <button class="web-ctrl-btn active" data-web="standard">STANDARD</button>
                    <button class="web-ctrl-btn" data-web="impact">IMPACT</button>
                    <button class="web-ctrl-btn" data-web="ricochet">RICOCHET</button>
                    <button class="web-ctrl-btn" data-web="explosive">EXPLOSIVE</button>
                </div>
            </div>

            <!-- FLUID DATA -->
            <div class="panel-section">
                <div class="section-title">FLUID COMPOSITION</div>
                <div class="data-display">
                    <div class="data-line"><span class="label">TYPE:</span> <span id="fluidType">STANDARD</span></div>
                    <div class="data-line"><span class="label">VISCOSITY:</span> <span id="fluidViscosity">MEDIUM</span></div>
                    <div class="data-line"><span class="label">DISSOLVE:</span> <span id="fluidDissolve">60MIN</span></div>
                </div>
            </div>

            <!-- DISPLAY OPTIONS -->
            <div class="panel-section">
                <div class="section-title">DISPLAY OPTIONS</div>
                <div class="button-grid-single">
                    <button class="option-btn" id="poseBtn">POSE</button>
                    <button class="option-btn" id="toggleParticles">PARTICLES</button>
                    <button class="option-btn" id="toggleRotation">ROTATE</button>
                </div>
                
                <div class="intensity-control">
                    <span class="label">INTENSITY</span>
                    <input type="range" id="intensitySlider" min="0.3" max="2" step="0.1" value="1">
                    <span id="intensityValue">100%</span>
                </div>
            </div>

            <!-- STATS -->
            <div class="panel-section footer">
                <div class="stat-line"><span id="fps">FPS: 60</span></div>
                <div class="stat-line">DRAG • SCROLL TO ZOOM</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="hologram.js"></script>
</body>
</html>
